<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/>
      <stop offset="1" stop-color="#14100a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#e6b450" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#e6b450" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#e6b450" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd278"/>
      <stop offset="0.5" stop-color="#e6b450"/>
      <stop offset="1" stop-color="#b88a30"/>
    </linearGradient>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- constellation dots -->
  <g fill="#ffd278" opacity="0.7">
    <circle cx="80" cy="60" r="1.6"/>
    <circle cx="180" cy="40" r="1.2"/>
    <circle cx="230" cy="110" r="1.8"/>
    <circle cx="320" cy="70" r="1.4"/>
    <circle cx="410" cy="150" r="1.6"/>
    <circle cx="90" cy="180" r="2.0"/>
    <circle cx="150" cy="250" r="1.4"/>
    <circle cx="260" cy="230" r="1.6"/>
    <circle cx="370" cy="270" r="1.2"/>
    <circle cx="470" cy="60" r="1.6"/>
    <circle cx="540" cy="100" r="1.2"/>
    <circle cx="600" cy="210" r="1.8"/>
    <circle cx="700" cy="140" r="1.4"/>
    <circle cx="800" cy="70" r="1.6"/>
    <circle cx="870" cy="180" r="1.2"/>
    <circle cx="940" cy="240" r="1.8"/>
    <circle cx="1030" cy="80" r="1.4"/>
    <circle cx="1110" cy="150" r="1.6"/>
    <circle cx="1180" cy="40" r="1.2"/>
    <circle cx="1220" cy="220" r="1.6"/>
    <circle cx="1150" cy="280" r="1.4"/>
  </g>
  <g stroke="#e6b450" stroke-width="0.6" opacity="0.35" fill="none">
    <line x1="80" y1="60" x2="180" y2="40"/>
    <line x1="180" y1="40" x2="230" y2="110"/>
    <line x1="230" y1="110" x2="320" y2="70"/>
    <line x1="230" y1="110" x2="90" y2="180"/>
    <line x1="90" y1="180" x2="150" y2="250"/>
    <line x1="150" y1="250" x2="260" y2="230"/>
    <line x1="260" y1="230" x2="370" y2="270"/>
    <line x1="410" y1="150" x2="540" y2="100"/>
    <line x1="470" y1="60" x2="540" y2="100"/>
    <line x1="600" y1="210" x2="700" y2="140"/>
    <line x1="700" y1="140" x2="800" y2="70"/>
    <line x1="800" y1="70" x2="870" y2="180"/>
    <line x1="870" y1="180" x2="940" y2="240"/>
    <line x1="1030" y1="80" x2="1110" y2="150"/>
    <line x1="1110" y1="150" x2="1180" y2="40"/>
    <line x1="1110" y1="150" x2="1220" y2="220"/>
    <line x1="1220" y1="220" x2="1150" y2="280"/>
  </g>

  <!-- discord mascot, simplified, left -->
  <g transform="translate(90, 155)" filter="url(#softglow)">
    <rect x="-46" y="-32" rx="18" ry="18" width="92" height="64" fill="#ffffff"/>
    <circle cx="-42" cy="22" r="7" fill="#ffffff"/>
    <circle cx="42" cy="22" r="7" fill="#ffffff"/>
    <circle cx="-18" cy="-4" r="7" fill="#1a1a1e"/>
    <circle cx="18" cy="-4" r="7" fill="#1a1a1e"/>
    <circle cx="0" cy="18" r="3" fill="#1a1a1e"/>
  </g>

  <!-- vertical gold divider -->
  <rect x="180" y="110" width="3" height="100" fill="url(#gold)" rx="1"/>

  <!-- title -->
  <text x="210" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#ffffff">Discord Member</text>
  <text x="210" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="url(#gold)" filter="url(#softglow)">Dumper</text>

  <!-- subtitle -->
  <text x="212" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#a5a09b" letter-spacing="1">Rust + egui · Gateway WebSocket · Lazy member list scraper</text>

  <!-- badge -->
  <g transform="translate(1110, 40)">
    <rect x="0" y="0" rx="18" ry="18" width="140" height="36" fill="#16161c" stroke="#e6b450" stroke-opacity="0.4"/>
    <text x="22" y="24" font-family="Segoe UI, sans-serif" font-size="14" fill="#a5a09b">built by </text>
    <text x="82" y="24" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="url(#gold)">Axthony</text>
  </g>

  <!-- version chip -->
  <g transform="translate(212, 90)">
    <rect x="0" y="0" rx="10" ry="10" width="82" height="22" fill="#1a1a20" stroke="#e6b450" stroke-opacity="0.5"/>
    <text x="12" y="15" font-family="Segoe UI, sans-serif" font-size="11" fill="#e6b450" font-weight="600">v0.1.0 · rust</text>
  </g>
</svg>
